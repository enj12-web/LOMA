<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Major Championship Pool</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2028;
    --border: #2a3441;
    --text: #e8eef5;
    --muted: #7d8b9c;
    --green: #4ade80;
    --red: #f87171;
    --gold: #fbbf24;
    --counts-bg: #1e2d3a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
    line-height: 1.4;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .subtitle { color: var(--muted); font-size: 13px; }
  .updated { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .warning {
    max-width: 1100px;
    margin: 0 auto 16px;
    background: #3a2a1a;
    border-left: 3px solid var(--gold);
    padding: 8px 12px;
    border-radius: 4px;
    color: #fde7c3;
    font-size: 13px;
  }
  .teams-grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }
  .team {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .team.dq { opacity: 0.65; }
  .team-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .team-name { font-weight: 600; font-size: 15px; }
  .rank {
    display: inline-block;
    min-width: 22px;
    text-align: center;
    background: var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 1px 6px;
    border-radius: 10px;
    margin-right: 6px;
  }
  .rank.first { background: var(--gold); color: #1a1a1a; }
  .total {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 16px;
  }
  .total.under { color: var(--green); }
  .total.over { color: var(--red); }
  .total.dq { color: var(--muted); font-size: 13px; font-weight: 500; }
  .player-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    font-size: 13px;
    padding: 3px 4px;
    border-radius: 3px;
    align-items: center;
  }
  .player-row.counts {
    background: var(--counts-bg);
  }
  .player-row.cut { color: var(--muted); text-decoration: line-through; }
  .player-row.notfound { color: var(--gold); }
  .player-score { font-variant-numeric: tabular-nums; text-align: right; min-width: 30px; }
  .player-pos { color: var(--muted); font-size: 11px; min-width: 35px; text-align: right; }
  .player-flag { font-size: 10px; color: var(--gold); }
  .empty-state {
    max-width: 1100px;
    margin: 60px auto;
    text-align: center;
    color: var(--muted);
  }
  footer {
    max-width: 1100px;
    margin: 24px auto 0;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1 id="pool-name">Major Championship Pool</h1>
  <div class="subtitle" id="event-name">Loading…</div>
  <div class="subtitle" id="event-status"></div>
  <div class="updated" id="updated"></div>
</header>
<div id="warning-area"></div>
<div class="teams-grid" id="teams"></div>
<div class="empty-state" id="empty" style="display:none;"></div>
<footer>Auto-refreshes every 60s · scoring: best 4 of 6 made-cut · DQ if &lt;4 make cut · <a href="admin.html" style="color:var(--muted);">admin</a></footer>

<script>
function fmtScore(n) {
  if (n === null || n === undefined) return '—';
  if (n === 0) return 'E';
  return n > 0 ? '+' + n : String(n);
}
function fmtTotal(n) {
  if (n === null || n === undefined) return '—';
  if (n === 0) return 'E';
  return n > 0 ? '+' + n : String(n);
}
function render(data) {
  document.getElementById('pool-name').textContent = data.pool_name || 'Major Pool';
  document.getElementById('event-name').textContent = data.event_name || '—';
  document.getElementById('event-status').textContent = data.event_status || '';
  const updated = data.updated_at ? new Date(data.updated_at).toLocaleString() : '';
  document.getElementById('updated').textContent = 'Last update: ' + updated;

  const warn = document.getElementById('warning-area');
  warn.innerHTML = '';
  if (data.not_found_players && data.not_found_players.length) {
    const w = document.createElement('div');
    w.className = 'warning';
    w.textContent = '⚠ Players not matched in ESPN leaderboard (check spelling in picks.json): ' + data.not_found_players.join(', ');
    warn.appendChild(w);
  }

  const grid = document.getElementById('teams');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  if (!data.teams || !data.teams.length) {
    empty.style.display = 'block';
    empty.textContent = data.event_status || 'No tournament in progress.';
    return;
  }
  empty.style.display = 'none';
  data.teams.forEach(team => {
    const card = document.createElement('div');
    card.className = 'team' + (team.status === 'DQ' ? ' dq' : '');
    const header = document.createElement('div');
    header.className = 'team-header';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'team-name';
    if (team.rank) {
      const r = document.createElement('span');
      r.className = 'rank' + (team.rank === 1 ? ' first' : '');
      r.textContent = team.rank;
      nameSpan.appendChild(r);
    }
    nameSpan.appendChild(document.createTextNode(team.team));
    header.appendChild(nameSpan);

    const tot = document.createElement('span');
    if (team.status === 'DQ') {
      tot.className = 'total dq';
      tot.textContent = 'DQ (cut)';
    } else {
      tot.className = 'total ' + (team.total < 0 ? 'under' : team.total > 0 ? 'over' : '');
      tot.textContent = fmtTotal(team.total);
    }
    header.appendChild(tot);
    card.appendChild(header);

    team.players.forEach(p => {
      const row = document.createElement('div');
      let cls = 'player-row';
      if (p.counts) cls += ' counts';
      else if (p.not_found) cls += ' notfound';
      else if (!p.made_cut) cls += ' cut';
      row.className = cls;
      const nameDiv = document.createElement('div');
      nameDiv.textContent = p.name + (p.not_found ? ' ⚠' : '');
      row.appendChild(nameDiv);
      const posDiv = document.createElement('div');
      posDiv.className = 'player-pos';
      posDiv.textContent = p.not_found ? '' : (p.made_cut ? (p.position ? '#' + p.position : '') : 'CUT');
      row.appendChild(posDiv);
      const scoreDiv = document.createElement('div');
      scoreDiv.className = 'player-score';
      scoreDiv.textContent = p.not_found ? '?' : fmtScore(p.score);
      row.appendChild(scoreDiv);
      card.appendChild(row);
    });
    grid.appendChild(card);
  });
}

async function load() {
  try {
    const resp = await fetch('standings.json?t=' + Date.now());
    const data = await resp.json();
    render(data);
  } catch (e) {
    console.error('load failed', e);
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>

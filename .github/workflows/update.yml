name: Update Standings

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'picks.json'
      - 'poller.py'

concurrency:
  group: update-standings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run poller
        run: python poller.py

      - name: Commit and push if standings changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standings.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update standings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
